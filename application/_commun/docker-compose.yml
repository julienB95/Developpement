# Instance PostgreSQL unique du NAS, partagee par toutes les applications.
# A deposer sur le NAS dans /volume1/docker/data/postgres/
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto
      TZ: Europe/Paris
    ports:
      # Port 5433 cote NAS : le 5432 est deja pris par PostgreSQL interne de DSM
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
