<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mes opérations — Suivi crypto</title>
    <link rel="icon" href="/image/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="entete">
    <a class="marque" href="/">
        <span class="marque-signe" aria-hidden="true">₿</span>
        <span class="marque-texte">Suivi crypto</span>
    </a>

    <div class="entete-droite">
        <div class="encart-marche" id="encart-marche" hidden></div>

        <!-- Devise d'affichage des montants : réglage du compte une fois connecté -->
        <button type="button" class="devise" id="bouton-devise">
            <span id="devise-symbole" aria-hidden="true">€</span>
        </button>

        <!-- Date du jour, heure de Paris et heure de New York -->
        <div class="horloge" id="horloge">
            <span class="horloge-jour" id="horloge-jour"></span>

            <span class="horloge-heure" title="Heure de Paris">
                <svg class="drapeau" viewBox="0 0 18 12" role="img" aria-label="France">
                    <rect width="6" height="12" fill="#002654"></rect>
                    <rect x="6" width="6" height="12" fill="#ffffff"></rect>
                    <rect x="12" width="6" height="12" fill="#ed2939"></rect>
                </svg>
                <span id="horloge-paris">--:--:--</span>
            </span>

            <span class="horloge-heure" title="Heure de New York (côte est)">
                <svg class="drapeau" viewBox="0 0 18 12" role="img" aria-label="États-Unis, côte est">
                    <rect width="18" height="12" fill="#ffffff"></rect>
                    <g fill="#b22234">
                        <rect y="0" width="18" height="0.92"></rect>
                        <rect y="1.85" width="18" height="0.92"></rect>
                        <rect y="3.69" width="18" height="0.92"></rect>
                        <rect y="5.54" width="18" height="0.92"></rect>
                        <rect y="7.38" width="18" height="0.92"></rect>
                        <rect y="9.23" width="18" height="0.92"></rect>
                        <rect y="11.08" width="18" height="0.92"></rect>
                    </g>
                    <rect width="7.2" height="6.46" fill="#3c3b6e"></rect>
                </svg>
                <span id="horloge-newyork">--:--:--</span>
            </span>
        </div>

        <nav class="compte" id="bloc-compte" aria-live="polite"></nav>
    </div>
</header>

<main>
    <nav class="fil" aria-label="Fil d'ariane">
        <a href="/">Accueil</a> <span aria-hidden="true">›</span> <span>Opérations</span>
    </nav>

    <h1>Mes opérations</h1>

    <p class="erreur" id="erreur-page" role="alert" hidden></p>

    <section class="espace" id="zone-operations" hidden>
        <div class="filtres" role="group" aria-label="Filtres">
            <div class="champ champ-filtre">
                <label for="filtre-annee">Année</label>
                <select id="filtre-annee"></select>
            </div>

            <div class="champ champ-filtre">
                <label for="filtre-crypto">Crypto</label>
                <select id="filtre-crypto"></select>
            </div>

            <div class="champ champ-filtre">
                <label for="filtre-sens">Sens</label>
                <select id="filtre-sens">
                    <option value="">Toutes</option>
                    <option value="achat">Achats</option>
                    <option value="vente">Ventes</option>
                </select>
            </div>

            <button type="button" class="bouton bouton-discret" id="filtre-reinitialiser">Réinitialiser</button>
        </div>

        <p class="resume-filtres" id="resume-filtres"></p>

        <div id="operations-contenu"></div>

        <nav class="pagination" id="operations-pagination" aria-label="Pagination des opérations" hidden>
            <button type="button" class="fleche" id="operations-precedent" aria-label="Page précédente">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"></path></svg>
            </button>
            <span class="pagination-position" id="operations-position"></span>
            <button type="button" class="fleche" id="operations-suivant" aria-label="Page suivante">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"></path></svg>
            </button>
        </nav>

        <div class="zone-ajout">
            <button type="button" class="bouton-rond" id="bouton-ajout-operation"
                    title="Ajouter une opération" aria-label="Ajouter une opération">
                <span aria-hidden="true">+</span>
            </button>
        </div>
    </section>

    <section class="espace" id="zone-deconnecte" hidden>
        <h2>Connexion requise</h2>
        <p class="espace-vide">
            Vos opérations sont accessibles une fois connecté.
            <a href="/">Revenir à l'accueil</a> pour vous connecter.
        </p>
    </section>
</main>

<footer class="pied">
    <p>Les informations présentées ne constituent pas un conseil fiscal. Vérifiez vos montants avant déclaration.</p>
</footer>

<script src="/commun.js"></script>
<script src="/marche.js"></script>
<script src="/pave.js"></script>
<script src="/operation.js"></script>
<script src="/operations.js"></script>
</body>
</html>
